#top{display:flex;align-items:center;padding:.35em .9em;background:var(--bg);border-bottom:var(--bw) solid var(--bd);font-size:.9em}
#top a{color:var(--accent);font-weight:700;text-decoration:none;letter-spacing:.05em}

#board.grid{background-image:linear-gradient(color-mix(in srgb,var(--bd) 30%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--bd) 30%,transparent) 1px,transparent 1px);background-size:20px 20px}

.dr{flex-basis:100%;padding-left:1.6em;color:var(--accent2);font-weight:700;font-size:.9em}
#modal{position:fixed;inset:0;z-index:20000;background:#000a;display:flex;align-items:center;justify-content:center;padding:1em}
#modal[hidden]{display:none}
.mbox{background:var(--panel);border:var(--bw) solid var(--bd);border-radius:var(--r);padding:.8em;width:min(560px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:.5em;box-shadow:var(--sh)}
textarea{width:100%;background:var(--bg);color:var(--text);border:var(--bw) solid var(--bd);border-radius:var(--r);font:12px/1.3 "Courier New",monospace;padding:.4em}
#msg{color:var(--accent2)}
#ttl svg{width:1.5em;height:1.5em;vertical-align:middle;margin-right:.2em}

[data-theme=bw90] input,[data-theme=bw90] select,[data-theme=bw90] textarea{border:2px inset #999;background:#fff;color:#000}

[data-theme=bw90] h1{color:#000;text-decoration:underline}
[data-theme=bw90] #top a{color:#00e;text-decoration:underline}

#themeBtn svg{width:1.5em;height:1.5em;vertical-align:middle}
#tp{position:fixed;inset:0;z-index:20000;background:#000a;display:flex;align-items:center;justify-content:center;padding:1em}
#tp[hidden]{display:none}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:.6em}
.tc{display:flex;flex-direction:column;align-items:center;gap:.3em;padding:.5em;height:auto}
.tc svg{width:76px;height:76px;border:1px solid #8886}
.tc.on{border-color:var(--accent);color:var(--accent)}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font:var(--fs)/1.35 var(--font)}
[data-theme=fairy] body{background:linear-gradient(160deg,#fbe9f7,#e6f3ff)}
button,input,select{font:inherit;color:inherit}
button{background:var(--panel);border:var(--bw) solid var(--bd);border-radius:var(--r);padding:.3em .6em;cursor:pointer;min-height:2.2em}
button:hover{border-color:var(--accent);color:var(--accent)}
input,select{background:transparent;border:var(--bw) solid transparent;border-radius:var(--r);padding:.3em .4em;min-width:0}
select{background:var(--panel);border-color:var(--bd)}
input:hover,input:focus{border-color:var(--bd);outline:none}
input:focus{border-color:var(--accent)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9999;display:flex;flex-wrap:wrap;gap:.5em;align-items:center;padding:.6em .9em;background:var(--panel);border-bottom:var(--bw) solid var(--bd);box-shadow:var(--sh)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--panel);z-index:10000}
h1{font-size:1.15em;margin:0 auto 0 0;color:var(--accent)}
#add{background:var(--accent);color:var(--bg);border-color:var(--accent)}
#board{position:relative;min-height:calc(100vh - 60px);overflow-x:auto}
.card{position:absolute;width:290px;background:var(--panel);border:var(--bw) solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);display:flex;flex-direction:column}
.hd{display:flex;gap:.3em;align-items:center;padding:.4em;border-bottom:var(--bw) solid var(--bd);cursor:grab;touch-action:none;user-select:none}
.hd.drag{cursor:grabbing}
.hd .name{flex:1;font-weight:700;color:var(--accent);width:100%}
.mob{display:none}
ul{list-style:none;margin:0;padding:.3em;max-height:46vh;overflow:auto}
li{display:flex;flex-wrap:wrap;align-items:center;gap:0 .25em;border-radius:var(--r);padding:1px 0}
li.drag{opacity:.6;background:var(--bg)}
li.hit{background:var(--accent);color:var(--bg)}
li.hit input{color:var(--bg)}
li.pick{background:var(--accent2);color:var(--bg)}
li input.t{flex:1 1 7em;width:100%}
.grip{cursor:grab;touch-action:none;color:var(--muted);padding:0 .25em;user-select:none}
.cnt{display:flex;align-items:center;gap:2px}
.cnt button{padding:0;min-width:2.2em;min-height:2.2em;font-size:1.25em;line-height:1;font-weight:700}
.cnt input{width:3.2em;text-align:center}
.x{border-color:transparent;background:transparent;color:var(--muted)}
.row{display:flex;gap:.3em;padding:.35em;border-top:var(--bw) dashed var(--bd);align-items:center;flex-wrap:wrap}
.row input{flex:1;border-color:var(--bd)}
.res{padding:.45em .6em;border-top:var(--bw) solid var(--bd);min-height:2.6em;color:var(--accent2);font-weight:700}
.opt{display:flex;align-items:center;gap:.3em;color:var(--muted);font-size:.9em;cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:3em 1em}
@media (max-width:760px){
 #board{display:flex;flex-direction:column;gap:.9em;padding:.8em;min-height:0!important}
 .card{position:static;width:100%}
 .hd{cursor:default;touch-action:auto}
 .mob{display:inline-block}
 ul{max-height:none}
}
</style>
</head>

 const es=true;

let zTop=10;
function render(){
 document.documentElement.dataset.theme=S.theme;document.documentElement.lang=S.lang;
 $("#ttl").innerHTML=ICONS[S.theme]+" "+T("title");$("#add").textContent=T("add");$("#snapL").textContent=T("snap");$("#snap").checked=!!S.snap;$("#exp").textContent="⬇ "+T("exp");$("#imp").textContent="⬆ "+T("imp");$("#board").classList.toggle("grid",!!S.snap);
 const tb0=$("#themeBtn");tb0.innerHTML=ICONS[S.theme]+" "+T("themes")[S.theme]+" ▾";tb0.title=T("theme");$("#tpT").textContent=T("theme");$("#tpX").textContent=T("close");const tg=$("#tg");tg.innerHTML="";for(const k in T("themes")){const b2=h("button",{class:"tc"+(k===S.theme?" on":""),onclick:()=>{S.theme=k;save();$("#tp").hidden=true;render()}});b2.innerHTML=ICONS[k]+"<span>"+T("themes")[k]+"</span>";tg.append(b2)}
 $("#lang").value=S.lang;
 const b=$("#board");b.innerHTML="";
 if(!S.tables.length)b.append(h("div",{class:"empty"},T("empty")));
 S.tables.forEach((tb,i)=>b.append(card(tb,i)));resolve();
 size();
}
function size(){const b=$("#board");if(mq.matches){b.style.minHeight="";return}let m=0;S.tables.forEach(t=>m=Math.max(m,t.y+520));b.style.minHeight=Math.max(m,innerHeight-60)+"px"}
function card(tb,idx){
 const c=h("section",{class:"card","data-id":tb.id,style:`left:${tb.x}px;top:${tb.y}px;z-index:${tb.z||1}`});
 const name=h("input",{class:"name",value:tb.name,oninput:e=>{tb.name=e.target.value;save()}});
 let armed=0;
 const del=h("button",{class:"x",title:T("del"),onclick:e=>{if(!armed){armed=1;e.target.textContent="⚠ "+T("sure");setTimeout(()=>{armed=0;e.target.textContent="🗑"},2500)}else{S.tables=S.tables.filter(t=>t!==tb);save();render()}}},"🗑");
 const mv=d=>h("button",{class:"x mob",title:d<0?T("up"):T("down"),onclick:()=>{const j=idx+d;if(j<0||j>=S.tables.length)return;[S.tables[idx],S.tables[j]]=[S.tables[j],S.tables[idx]];save();render()}},d<0?"↑":"↓");
 const hd=h("div",{class:"hd"},h("span",{class:"grip"},"✥"),name,mv(-1),mv(1),del);
 hd.onpointerdown=e=>{
  if(mq.matches||e.target.closest("input,button"))return;
  e.preventDefault();hd.setPointerCapture(e.pointerId);hd.classList.add("drag");
  tb.z=++zTop;c.style.zIndex=tb.z;
  const sx=e.clientX,sy=e.clientY,ox=tb.x,oy=tb.y;
  hd.onpointermove=ev=>{let nx=Math.max(0,ox+ev.clientX-sx),ny=Math.max(0,oy+ev.clientY-sy);if(S.snap){nx=sn(nx);ny=sn(ny)}else{nx=Math.round(nx);ny=Math.round(ny)}
   const w=c.offsetWidth,hh=c.offsetHeight;
   const to=(x,y)=>{tb.x=x;tb.y=y;c.style.left=x+"px";c.style.top=y+"px";size()};
   if(free(tb,nx,ny,w,hh))to(nx,ny);else if(free(tb,nx,tb.y,w,hh))to(nx,tb.y);else if(free(tb,tb.x,ny,w,hh))to(tb.x,ny)};
  hd.onpointerup=hd.onpointercancel=()=>{hd.classList.remove("drag");hd.onpointermove=hd.onpointerup=hd.onpointercancel=null;save()};
 };
 const ul=h("ul");
 tb.items.forEach(it=>ul.append(rowEl(tb,it,ul)));
 const res=h("div",{class:"res"},"");
 const inp=h("input",{placeholder:T("item"),"data-add":tb.id,onkeydown:e=>{if(e.key==="Enter")addIt()}});
 const addIt=()=>{const v=inp.value.trim();if(!v)return;tb.items.push({id:nid(),t:v,n:0});save();render();const n=document.querySelector(`[data-add="${tb.id}"]`);if(n)n.focus()};
 const roll=h("button",{onclick:()=>doRoll(tb,ul,res)},T("roll"));
 const sel=h("select",{onchange:e=>{tb.type=e.target.value;save();render()}},...[["text","tText"],["counters","tCnt"],["dice","tDice"]].map(([v,k])=>h("option",{value:v},T(k))));sel.value=tb.type;
 const opt=h("label",{class:"opt"},T("type"),sel);
 c.append(hd,ul,h("div",{class:"row"},inp,h("button",{onclick:addIt},T("addItem"))),h("div",{class:"row"},roll,opt),res);
 return c;
}
function rowEl(tb,it,ul){
 const li=h("li",{class:"t-"+tb.type,"data-id":it.id});
 const g=h("span",{class:"grip",title:"⇅"},"⋮⋮");
 g.onpointerdown=e=>{
  e.preventDefault();g.setPointerCapture(e.pointerId);li.classList.add("drag");
  g.onpointermove=ev=>{
   for(const r of [...ul.children]){if(r===li)continue;const b=r.getBoundingClientRect();if(ev.clientY<b.top+b.height/2){ul.insertBefore(li,r);return}}
   ul.append(li);
  };
  g.onpointerup=g.onpointercancel=()=>{
   li.classList.remove("drag");g.onpointermove=g.onpointerup=g.onpointercancel=null;
   tb.items=[...ul.children].map(r=>tb.items.find(i=>i.id===r.dataset.id)).filter(Boolean);save();
  };
 };
 li.append(g,h("input",{class:"t",value:it.t,oninput:e=>{it.t=e.target.value;save()}}));
 if(tb.type==="dice"){const rs=h("span",{class:"dr"});const rb=h("button",{title:T("rollDie"),onclick:()=>{const r=rollDice(it.t);rs.textContent=r?r.txt:T("badDice")}},"🎲");li.append(rb);li._rs=rs}
 if(tb.type==="counters"){
  const n=h("input",{type:"number",inputmode:"numeric",value:it.n||0,oninput:e=>{it.n=parseInt(e.target.value,10)||0;save()}});
  const st=d=>()=>{it.n=(it.n||0)+d;n.value=it.n;save()};
  li.append(h("div",{class:"cnt"},h("button",{onclick:st(-1)},"−"),n,h("button",{onclick:st(1)},"+")));
 }
 li.append(h("button",{class:"x",onclick:()=>{tb.items=tb.items.filter(i=>i!==it);save();render()}},"✕"));
 if(li._rs)li.append(li._rs);return li;
}
function rollDice(s){const m=/\b(\d*)d(\d+)(?:\s*([+-])\s*(\d+))?/i.exec(s||"");if(!m)return null;const n=Math.min(100,+m[1]||1),f=+m[2];if(f<1||n<1)return null;const rs=[];for(let i=0;i<n;i++)rs.push(1+Math.floor(Math.random()*f));const mod=m[3]?(m[3]==="-"?-1:1)*(+m[4]):0;const tot=rs.reduce((a,b)=>a+b,0)+mod;return{total:tot,txt:"["+rs.join(", ")+"]"+(mod?(mod>0?" +":" ")+mod:"")+" = "+tot}}
function doRoll(tb,ul,res){
 if(!tb.items.length){res.textContent=T("none");return}
 const rows=[...ul.children];rows.forEach(r=>r.classList.remove("hit","pick"));
 const final=Math.floor(Math.random()*rows.length);let k=0;const steps=Math.min(10,rows.length*2);
 const tick=()=>{
  rows.forEach(r=>r.classList.remove("pick"));
  if(k<steps){rows[Math.floor(Math.random()*rows.length)].classList.add("pick");k++;setTimeout(tick,55)}
  else{rows[final].classList.add("hit");rows[final].scrollIntoView({block:"nearest"});const it=tb.items[final];const r=tb.type==="dice"?rollDice(it.t):null;res.textContent="🎲 "+it.t+(r?" → "+r.txt:"")}
 };
 tick();
}
$("#add").onclick=()=>{
 const n=S.tables.length;
 S.tables.push({id:nid(),name:T("newName"),type:"text",x:20+(n%4)*310,y:20+Math.floor(n/4)*360,z:++zTop,items:[]});
 save();render();
 if(mq.matches)scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
};
$("#themeBtn").onclick=()=>{$("#tp").hidden=false};
$("#tpX").onclick=()=>{$("#tp").hidden=true};
$("#tp").onclick=e=>{if(e.target.id==="tp")$("#tp").hidden=true};
$("#lang").onchange=e=>{S.lang=e.target.value;save();render()};
$("#snap").onchange=e=>{S.snap=e.target.checked;if(S.snap)S.tables.forEach(t=>{t.x=sn(t.x);t.y=sn(t.y)});save();render()};
const modal=$("#modal"),txt=$("#txt"),msg=$("#msg");
function openModal(json){$("#mT").textContent=T("imp")+" / "+T("exp");$("#mF").textContent=T("fileLbl");$("#url").placeholder=T("urlLbl")+" (https://…)";$("#mU").textContent=T("load");$("#mI").textContent=T("doImp");$("#mX").textContent=T("close");txt.placeholder=T("paste");txt.value=json||"";msg.textContent="";modal.hidden=false}
function doImport(str){try{S=norm(JSON.parse(str));save();modal.hidden=true;render()}catch(e){msg.textContent=T("errImp")}}
$("#imp").onclick=()=>openModal("");
$("#mX").onclick=()=>{modal.hidden=true};
$("#mI").onclick=()=>doImport(txt.value);
$("#file").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>doImport(r.result);r.readAsText(f);e.target.value=""};
$("#mU").onclick=async()=>{const u=$("#url").value.trim();if(!/^https?:\/\//i.test(u)){msg.textContent=T("errUrl");return}try{const r=await fetch(u);if(!r.ok)throw 0;doImport(await r.text())}catch(e){msg.textContent=T("errUrl")}};
$("#exp").onclick=async()=>{const data=JSON.stringify({app:"gm-dashboard",version:1,lang:S.lang,theme:S.theme,snap:S.snap,tables:S.tables.map(({name,type,x,y,items})=>({name,type,x,y,items:items.map(({t,n})=>({t,n}))}))},null,2);
 let d=null;try{d=await claude.use("downloads")}catch(e){}
 if(d){try{await d.save({filename:"cuadro-de-mando.json",data});return}catch(e){if(e&&e.code==="declined")return}}
 openModal(data)};
mq.onchange=()=>render();
addEventListener("resize",size);
S.tables.forEach(t=>zTop=Math.max(zTop,t.z||1));
render();
</script>
